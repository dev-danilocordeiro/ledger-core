spring:
  application:
    name: ledger-core
  threads:
    virtual:
      # Virtual threads instead of coroutines. See ADR-0003: the workload is JDBC with
      # pessimistic row locks, and a lock must be held by a thread that is pinned to the
      # connection for the life of the transaction. Loom gives the scalability without
      # rewriting the persistence layer onto R2DBC.
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Fail fast rather than queue: a request that waits 30s for a connection has
      # already breached any sane client timeout.
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ledger:
  outbox:
    topic: ${OUTBOX_TOPIC:ledger.transactions}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

logging:
  level:
    root: INFO
    dev.danilocordeiro.ledger: ${LOG_LEVEL:INFO}
