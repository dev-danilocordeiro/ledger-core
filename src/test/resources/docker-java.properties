# Docker Engine 29.x raised the minimum supported Docker Remote API to 1.40; the
# docker-java client shaded into Testcontainers still defaults its connectivity probe
# to 1.32 and gets rejected before any container ever starts. Pinning a version inside
# what the running daemon supports fixes local Testcontainers-based integration tests
# without waiting on a testcontainers upstream release.
api.version=1.44
